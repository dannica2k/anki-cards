<!-- Settings Modal -->
<div id="modal-container" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100 animate-in fade-in zoom-in-95 duration-150">
    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
      <div class="flex items-center gap-2.5">
        <span class="material-symbols-outlined text-slate-700 text-2xl">settings</span>
        <h3 class="font-semibold text-slate-800 text-lg">Project Settings</h3>
      </div>
      <button onclick="document.getElementById('modal-container').remove()" class="p-1 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="mt-4 space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Architecture</label>
        <div class="px-3 py-2 bg-emerald-50 text-emerald-800 rounded-lg text-xs font-medium border border-emerald-200 flex items-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>FastAPI + HTMX + Tailwind (Zero Re-Runs, Instant SSE)</span>
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Backup Project API Key</label>
        <div class="px-3 py-2 bg-slate-50 rounded-lg text-xs font-mono text-slate-600 border border-slate-200">
          {{ project_key_masked or 'Configured via .env' }}
        </div>
        <p class="text-xs text-slate-400 mt-1">Used automatically if personal user quota is exhausted.</p>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Google Drive Folder ID</label>
        <div class="px-3 py-2 bg-slate-50 rounded-lg text-xs font-mono text-slate-600 border border-slate-200 truncate">
          {{ target_folder_id or '16v8w952a1v9FmZg8x5T_default' }}
        </div>
      </div>

      <div class="flex justify-end pt-3">
        <button type="button" onclick="document.getElementById('modal-container').remove()" 
                class="px-4 py-2 text-sm font-medium text-white bg-slate-800 hover:bg-slate-900 rounded-lg shadow-sm transition">Done</button>
      </div>
    </div>
  </div>
</div>
