<!-- Manage Courses Modal -->
<div id="modal-container" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-100 animate-in fade-in zoom-in-95 duration-150">
    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
      <div class="flex items-center gap-2.5">
        <span class="material-icons text-brand text-2xl">school</span>
        <div>
          <h3 class="font-bold text-slate-800 text-lg">Manage Target Courses</h3>
          <p class="text-xs text-slate-500">Configure courses, naming conventions, and deck profiles for Mara.</p>
        </div>
      </div>
      <button onclick="document.getElementById('modal-container').remove()" 
              class="p-1 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="mt-4">
      {% include "partials/courses_modal_body.html" %}
    </div>

    <div class="flex justify-end pt-4 mt-2 border-t border-slate-100">
      <button type="button" onclick="document.getElementById('modal-container').remove()" 
              class="px-4 py-2 text-xs font-semibold text-white bg-slate-800 hover:bg-slate-900 rounded-xl shadow-xs transition">
        Done
      </button>
    </div>
  </div>
</div>
