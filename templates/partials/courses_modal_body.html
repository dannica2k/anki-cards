<div id="courses-modal-body" class="space-y-4">
  <!-- Active Courses List -->
  <div class="space-y-2">
    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">Active Courses</label>
    <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
      {% for c in courses %}
      <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-200/80 rounded-xl hover:bg-slate-100/60 transition">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="px-2.5 py-1 bg-brand text-white text-xs font-bold rounded-lg shrink-0">
            {{ c.code }}
          </span>
          <div class="truncate text-xs font-medium text-slate-700">
            {{ c.title or 'Course Profile' }}
          </div>
        </div>
        <button type="button" 
                hx-post="/api/courses/delete?slug={{ c.slug }}" 
                hx-target="#courses-modal-body"
                hx-confirm="Are you sure you want to remove {{ c.code }}?"
                class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition shrink-0" 
                title="Remove Course">
          <span class="material-icons text-base">delete_outline</span>
        </button>
      </div>
      {% endfor %}
      {% if not courses %}
      <div class="text-xs text-slate-400 italic text-center py-4">No courses configured yet.</div>
      {% endif %}
    </div>
  </div>

  <!-- Add New Course Form -->
  <div class="pt-3 border-t border-slate-100">
    <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider block mb-2">Add New Course</label>
    <form hx-post="/api/courses/add" hx-target="#courses-modal-body" class="space-y-3">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <div class="sm:col-span-1">
          <input type="text" name="course_code" required placeholder="e.g. BISC 101"
                 class="w-full px-3 py-2 text-xs font-bold uppercase rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand">
        </div>
        <div class="sm:col-span-2">
          <input type="text" name="course_title" required placeholder="e.g. General Biology: Cells & Organisms"
                 class="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand">
        </div>
      </div>
      <button type="submit" 
              class="w-full py-2 px-3 bg-brand hover:bg-brandDark text-white text-xs font-semibold rounded-xl shadow-xs transition flex items-center justify-center gap-1.5">
        <span class="material-icons text-sm">add</span>
        <span>Add Course</span>
      </button>
    </form>
  </div>
</div>
