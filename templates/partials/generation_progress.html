<!-- Real-Time Generation Progress via SSE -->
<div id="generation-progress-box" class="bg-white rounded-2xl border border-blue-200/80 shadow-md p-6 space-y-5 animate-in fade-in"
     hx-ext="sse" sse-connect="/api/generate/stream?job_id={{ job_id }}" sse-swap="finish" sse-close="finish" hx-swap="outerHTML">

  <!-- SSE Message Sink for Out-of-Band Swaps -->
  <div id="sse-event-sink" sse-swap="message" class="hidden"></div>

  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-blue-100 text-brand flex items-center justify-center animate-spin">
        <span class="material-icons text-xl">sync</span>
      </div>
      <div>
        <h4 class="font-bold text-slate-800 text-base" id="sse-stage-title">Analyzing Lecture Slides...</h4>
        <p class="text-xs text-slate-500" id="sse-stage-desc">Extracting text & diagrams via Gemini Multimodal API</p>
      </div>
    </div>
    <span class="px-3 py-1 bg-blue-50 text-brand font-mono font-bold text-sm rounded-full border border-blue-100" id="sse-percentage">5%</span>
  </div>

  <!-- Progress Bar -->
  <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden p-0.5 border border-slate-200/60">
    <div id="sse-progress-bar" class="bg-gradient-to-r from-blue-500 to-brand h-full rounded-full transition-all duration-300" style="width: 5%"></div>
  </div>

  <!-- Live Generation Log Output -->
  <div class="bg-slate-900 rounded-xl p-4 text-xs font-mono text-slate-300 max-h-48 overflow-y-auto space-y-1 shadow-inner" id="sse-log-container">
    <div class="text-emerald-400">⚡ Initialized AI generation job for {{ course_code }} Session {{ session_num }}</div>
    <div id="sse-logs" class="space-y-1 mt-1"></div>
  </div>
</div>

<script>
  (function() {
    const box = document.getElementById('generation-progress-box');
    if (box) {
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  })();
</script>
