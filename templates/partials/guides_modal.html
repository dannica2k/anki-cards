<!-- Study Guides Library Modal -->
<div id="modal-container" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-6 border border-slate-100 animate-in fade-in zoom-in-95 duration-150 max-h-[85vh] flex flex-col">
    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
      <div class="flex items-center gap-2.5">
        <span class="material-symbols-outlined text-brand text-2xl">auto_stories</span>
        <div>
          <h3 class="font-semibold text-slate-800 text-lg">Study Guides Library</h3>
          <p class="text-xs text-slate-500">Previously generated illustrated guides and PDFs</p>
        </div>
      </div>
      <button onclick="document.getElementById('modal-container').remove()" class="p-1 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div id="guides-modal-body" class="mt-4 flex-1 overflow-y-auto space-y-2 pr-1">
      {% include "partials/guides_modal_body.html" %}
    </div>

    <div class="flex justify-end pt-4 border-t border-slate-100 mt-2">
      <button type="button" onclick="document.getElementById('modal-container').remove()" 
              class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Close</button>
    </div>
  </div>
</div>
