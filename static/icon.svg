<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Drop Shadow for Cards -->
    <filter id="shadowPrimary" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0F2E6B" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2E6B" flood-opacity="0.15"/>
    </filter>

    <filter id="shadowSecondary" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0F2E6B" flood-opacity="0.20"/>
    </filter>

    <!-- Primary Card Gradient -->
    <linearGradient id="primaryCard" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#4392FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Secondary Card Gradient -->
    <linearGradient id="secondaryCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Spark Radial Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#FFBE0B" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#FFBE0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFBE0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Spark Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="50%" stop-color="#FFBE0B"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>
  </defs>

  <!-- Secondary Stacked Card (Tilted Left) -->
  <g transform="rotate(-9, 215, 275)" filter="url(#shadowSecondary)">
    <rect x="95" y="125" width="235" height="300" rx="38" fill="url(#secondaryCard)"/>
  </g>

  <!-- Primary Foreground Card -->
  <g filter="url(#shadowPrimary)">
    <rect x="155" y="115" width="235" height="305" rx="40" fill="url(#primaryCard)"/>

    <!-- Card Details Preview Lines -->
    <!-- Avatar / Bullet Dot -->
    <circle cx="210" cy="172" r="16" fill="#FFFFFF" fill-opacity="0.95"/>
    
    <!-- Title Pill -->
    <rect x="240" y="164" width="95" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.95"/>

    <!-- Body Line 1 -->
    <rect x="195" y="218" width="155" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.85"/>

    <!-- Body Line 2 -->
    <rect x="195" y="250" width="120" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>

  <!-- Spark Glow Sphere -->
  <circle cx="375" cy="125" r="85" fill="url(#sparkGlow)"/>

  <!-- Four-Point Star (Sparkle) -->
  <path d="M 375 58 
           C 375 104, 396 125, 442 125 
           C 396 125, 375 146, 375 192 
           C 375 146, 354 125, 308 125 
           C 354 125, 375 104, 375 58 Z" 
        fill="url(#starGrad)"/>

  <!-- Inner Spark Highlight Center -->
  <circle cx="375" cy="125" r="5" fill="#FFFFFF" fill-opacity="0.95"/>
</svg>
